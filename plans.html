    <div id="header">
        <div id="title">Productivity & Wellness Plans</div>
    </div>
    <div id="quiz-container">
      <h1>📝 Questionnaire</h1>
      <div id="progress-bar-container">
          <div id="progress-bar"></div>
      </div>
      <div id="questionnaire"></div>
      <button id="submit-btn" style="display: none;">Generate Report</button>
      <div id="report"></div>
  </div>
  
  <!-- Move buttons below the quiz container -->
  <div id="quiz-controls">
      <button id="back-btn" style="display: none;">Back</button>
      <button id="next-btn">Next</button>
  </div>
  
        <script>

function toggleNav() {
    const navMenu = document.querySelector(".nav-menu");
    navMenu.classList.toggle("show");
}


           let questions = [
    { question: "What is your name?", type: "text", id: "name" },
    { question: "What is your MBTI personality type?", type: "select", options: ["INTJ", "INTP", "ENTJ", "ENTP", "INFJ", "INFP", "ENFJ", "ENFP", "ISTJ", "ISFJ", "ESTJ", "ESFJ", "ISTP", "ISFP", "ESTP", "ESFP"], id: "mbti" },
    { question: "When do you feel most productive?", type: "radio", options: ["Morning", "Afternoon", "Evening", "Night"], id: "peak_time" },
    { question: "Which work environment do you prefer?", type: "radio", options: ["Quiet space", "Background music", "Café vibes", "Outdoor setting"], id: "environment" },
    { question: "What type of learner are you?", type: "radio", options: ["Visual", "Auditory", "Kinesthetic", "Reading/Writing"], id: "learning_style" },
    { question: "Do you prefer structured or flexible schedules?", type: "radio", options: ["Structured", "Flexible"], id: "schedule" },
    { question: "How do you usually handle stress?", type: "radio", options: ["Exercise", "Meditation", "Talking to someone", "Working on a hobby"], id: "stress_management" },
    { question: "What is your preferred break activity?", type: "radio", options: ["Walking", "Listening to music", "Stretching", "Gaming"], id: "break_activity" },
    { question: "How do you track tasks?", type: "radio", options: ["To-do lists", "Planner", "Digital apps", "I don’t track"], id: "task_tracking" },
    { question: "How many hours of sleep do you get?", type: "radio", options: ["Less than 5", "5-6", "7-8", "More than 8"], id: "sleep" },
    { question: "How do you handle procrastination?", type: "radio", options: ["Strict deadlines", "Pomodoro method", "Accountability partner", "I struggle with it"], id: "procrastination" },
    { question: "What motivates you to complete tasks?", type: "radio", options: ["Rewards", "Deadlines", "Sense of accomplishment", "Avoiding stress"], id: "motivation" }
];

let currentIndex = 0;
let responses = {};

function updateProgressBar() {
    const progress = ((currentIndex + 1) / questions.length) * 100;
    document.getElementById("progress-bar").style.width = progress + "%";
}

function displayQuestion() {
    const questionnaire = document.getElementById("questionnaire");
    questionnaire.innerHTML = "";
    let q = questions[currentIndex];
    let questionElement = `<p>${q.question}</p>`;
    
    if (q.type === "text") {
        questionElement += `<input type="text" id="${q.id}" name="${q.id}" value="${responses[q.id] || ''}">`;
    } else if (q.type === "select") {
        questionElement += `<select id="${q.id}" name="${q.id}">`;
        q.options.forEach(option => {
            questionElement += `<option value="${option}" ${responses[q.id] === option ? 'selected' : ''}>${option}</option>`;
        });
        questionElement += "</select>";
    } else if (q.type === "radio") {
        q.options.forEach(option => {
            questionElement += `<input type="radio" name="${q.id}" value="${option}" ${responses[q.id] === option ? 'checked' : ''}> ${option}<br>`;
        });
    }
    questionnaire.innerHTML = questionElement;
    updateProgressBar();
    document.getElementById("back-btn").style.display = currentIndex > 0 ? "inline-block" : "none";
    document.getElementById("next-btn").style.display = currentIndex < questions.length - 1 ? "inline-block" : "none";
    document.getElementById("submit-btn").style.display = currentIndex === questions.length - 1 ? "inline-block" : "none";
}

document.getElementById("next-btn").addEventListener("click", function() {
    const q = questions[currentIndex];
    let input = document.querySelector(`[name="${q.id}"]:checked`) || document.getElementById(q.id);
    
    if (!input || input.value.trim() === "") {
        alert("Please answer the question before proceeding.");
        return;
    }
    responses[q.id] = input.value;
    currentIndex++;
    displayQuestion();
});

document.getElementById("back-btn").addEventListener("click", function() {
    if (currentIndex > 0) {
        currentIndex--;
        displayQuestion();
    }
});

document.getElementById("submit-btn").addEventListener("click", function() {
    let reportText = `<h2>${responses.name || 'Your'} Personalized Productivity & Wellness Report</h2>`;
    
    if (responses.peak_time) {
        reportText += `<p>You are most productive in the <b>${responses.peak_time}</b>. Optimize your schedule around this time.</p>`;
    }
    if (responses.environment) {
        reportText += `<p>You prefer working in a <b>${responses.environment}</b> environment. Adjust your workspace accordingly.</p>`;
    }
    if (responses.learning_style) {
        reportText += `<p>Your learning style is <b>${responses.learning_style}</b>, so tailor your study techniques to this.</p>`;
    }
    if (responses.sleep) {
        reportText += `<p>You get <b>${responses.sleep}</b> hours of sleep. Aim for 7-8 hours for optimal productivity.</p>`;
    }
    if (responses.stress_management) {
        reportText += `<p>You handle stress by <b>${responses.stress_management}</b>. Continue using effective strategies.</p>`;
    }
    if (responses.procrastination === "I struggle with it") {
        reportText += `<p>Consider using the Pomodoro method or accountability partners to manage procrastination better.</p>`;
    }
    
    reportText += "<p>For mental wellness, try incorporating mindfulness and relaxation techniques.</p>";
    document.getElementById("report").innerHTML = reportText;
});

displayQuestion();
            
        </script>
